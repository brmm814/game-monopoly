<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Monopoli · NextGen Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-main: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --board-bg: #1e293b;
            --p1-color: #ff4757;
            --p1-glow: rgba(255, 71, 87, 0.4);
            --p2-color: #2ed573;
            --p2-glow: rgba(46, 213, 115, 0.4);
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 71, 87, 0.12) 0px, transparent 50%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
            padding: 20px;
            position: relative;
        }

        /* OVERLAY PILIHAN MODE */
        .mode-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .mode-card {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .mode-title {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .mode-subtitle {
            color: var(--text-sub);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .mode-buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn-mode {
            background: rgba(51, 65, 85, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 16px 20px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .btn-mode:hover {
            border-color: var(--accent);
            background: rgba(56, 189, 248, 0.15);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.2);
        }

        /* GAME CONTAINER */
        .game-container {
            display: flex;
            flex-wrap: wrap;
            gap: 32px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 32px;
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 1150px;
            width: 100%;
            justify-content: center;
            align-items: flex-start;
        }

        /* BOARD GRID 5x5 */
        .board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            width: 540px;
            height: 540px;
            background-color: var(--board-bg);
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            position: relative;
            flex-shrink: 0;
            padding: 8px;
            gap: 6px;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
        }

        .space {
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-size: 11px;
            text-align: center;
            position: relative;
            background: rgba(51, 65, 85, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .space:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.2);
            z-index: 5;
        }

        .space-header {
            height: 14px;
            width: 100%;
            flex-shrink: 0;
        }

        .space-name {
            padding: 4px 2px;
            font-weight: 600;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #e2e8f0;
            line-height: 1.2;
        }

        .space-price {
            padding: 3px 0;
            background: rgba(15, 23, 42, 0.6);
            font-size: 10px;
            font-weight: 700;
            color: var(--accent);
        }

        /* CENTER AREA */
        .center-area {
            grid-column: 2 / 5;
            grid-row: 2 / 5;
            background: rgba(15, 23, 42, 0.85);
            border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            text-align: center;
            position: relative;
        }

        .center-top {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 16px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            margin-bottom: 6px;
            transition: transform 0.3s ease;
        }

        .logo-img:hover {
            transform: scale(1.05) rotate(2deg);
        }

        .logo-text {
            font-family: 'Arial Black', sans-serif;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .logo-sub {
            font-size: 10px;
            color: var(--text-sub);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
        }

        #dice-display {
            font-size: 36px;
            margin-top: 4px;
            line-height: 1;
            filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.5));
        }

        /* CONTAINER 4 LOGO KIRI BAWAH */
        .bottom-left-logos {
            position: absolute;
            bottom: 10px;
            left: 10px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            background: rgba(30, 41, 59, 0.6);
            padding: 6px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .small-logo {
            width: 28px;
            height: 28px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: #0f172a;
            transition: transform 0.2s, border-color 0.2s;
        }

        .small-logo:hover {
            transform: scale(1.15);
            border-color: var(--accent);
        }

        /* TOKENS */
        .tokens-container {
            position: absolute;
            bottom: 4px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 4px;
            z-index: 10;
        }

        .player-token {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .p1-token { background: var(--p1-color); box-shadow: 0 0 10px var(--p1-glow); }
        .p2-token { background: var(--p2-color); box-shadow: 0 0 10px var(--p2-glow); }

        /* OWNER MARKER */
        .owner-badge {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            box-shadow: 0 0 6px currentColor;
        }

        /* CONTROLS PANEL */
        .controls {
            flex: 1;
            min-width: 300px;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .players-wrapper {
            display: flex;
            gap: 12px;
        }

        .player-card {
            flex: 1;
            padding: 16px;
            border-radius: 20px;
            background: rgba(30, 41, 59, 0.5);
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .player-card.active.p1 {
            border-color: var(--p1-color);
            background: rgba(255, 71, 87, 0.1);
            box-shadow: 0 0 20px var(--p1-glow);
        }

        .player-card.active.p2 {
            border-color: var(--p2-color);
            background: rgba(46, 213, 115, 0.1);
            box-shadow: 0 0 20px var(--p2-glow);
        }

        .player-card h3 {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .player-card .money {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
        }

        .player-card .location {
            font-size: 11px;
            color: var(--accent);
            margin-top: 4px;
        }

        .action-area {
            background: rgba(15, 23, 42, 0.8);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        .action-area p {
            font-size: 14px;
            color: #e2e8f0;
            margin-bottom: 16px;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn {
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none;
        }

        #property-actions {
            display: none;
            gap: 10px;
        }

        .btn-buy {
            background: linear-gradient(135deg, #2ed573, #10b981);
            box-shadow: 0 4px 12px rgba(46, 213, 115, 0.3);
        }

        .btn-pass {
            background: linear-gradient(135deg, #64748b, #475569);
            box-shadow: none;
        }

        .btn-reset {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-sub);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }

        .btn-reset:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        .log-box {
            height: 160px;
            overflow-y: auto;
            background: rgba(15, 23, 42, 0.9);
            padding: 14px;
            border-radius: 16px;
            font-size: 12px;
            font-family: monospace;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column-reverse;
        }

        .log-entry {
            margin-bottom: 6px;
            color: var(--text-sub);
            line-height: 1.4;
        }

        .log-entry:first-child {
            color: var(--accent);
            font-weight: 600;
        }

        /* SPECIAL TILES STYLES */
        .type-go { background: rgba(34, 197, 94, 0.15); }
        .type-jail { background: rgba(239, 68, 68, 0.15); }
        .type-parking { background: rgba(234, 179, 8, 0.15); }
        .type-gotojail { background: rgba(168, 85, 247, 0.15); }
        .type-chance { background: rgba(249, 115, 22, 0.15); }

        @media (max-width: 640px) {
            .board { width: 100%; height: auto; aspect-ratio: 1/1; }
            .game-container { padding: 16px; }
            .logo-img { width: 60px; height: 60px; }
            .logo-text { font-size: 18px; }
            .bottom-left-logos { bottom: 6px; left: 6px; }
            .small-logo { width: 22px; height: 22px; }
        }
    </style>
</head>
<body>

<!-- OVERLAY PILIHAN MODE PERMAINAN -->
<div class="mode-overlay" id="mode-overlay">
    <div class="mode-card">
        <div class="mode-title">Pilih Mode Permainan</div>
        <div class="mode-subtitle">Silakan pilih lawan bertanding Anda</div>
        <div class="mode-buttons">
            <button class="btn-mode" onclick="startGame('pvp')">
                <span>👥</span> 1 vs 1 (Pemain vs Pemain)
            </button>
            <button class="btn-mode" onclick="startGame('ai')">
                <span>🤖</span> 1 vs AI (Pemain vs Bot)
            </button>
        </div>
    </div>
</div>

<div class="game-container">
    <!-- BOARD -->
    <div class="board" id="board">
        <div class="center-area">
            <div class="center-top">
                <!-- LOGO UTAMA DI TENGAH -->
                <img class="logo-img" 
                     src="images/br.png" 
                     alt="Logo Monopoli" 
                     title="Logo Mini Monopoli"
                     onerror="this.src='https://via.placeholder.com/80/1e293b/38bdf8?text=LOGO'">
                <div class="logo-text">MONOPOLI</div>
                <div class="logo-sub">★ edisi mini ★</div>
                <div id="dice-display">⚀</div>
            </div>

            <!-- 4 LOGO DI KIRI BAWAH CENTER AREA -->
            <div class="bottom-left-logos" title="Sponsor & Mitra Resmi">
                <img class="small-logo" src="images/logo2.jpg" alt="Logo 1" onerror="this.src='https://via.placeholder.com/28/38bdf8/ffffff?text=L1'">
                <img class="small-logo" src="images/logo1.jpg" alt="Logo 2" onerror="this.src='https://via.placeholder.com/28/2ed573/ffffff?text=L2'">
                <img class="small-logo" src="images/3.jpg" alt="Logo 3" onerror="this.src='https://via.placeholder.com/28/ff4757/ffffff?text=L3'">
                <img class="small-logo" src="images/IMG-20260728-WA0006.jpg" alt="Logo 4" onerror="this.src='https://via.placeholder.com/28/eab308/ffffff?text=L4'">
            </div>
        </div>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
        <div class="players-wrapper">
            <div class="player-card p1 active" id="card-p1">
                <h3 id="name-p1">🔴 Pemain 1</h3>
                <div class="money">Rp <span id="money-p1">1500</span></div>
                <div class="location">📍 <span id="pos-p1">GO</span></div>
            </div>

            <div class="player-card p2" id="card-p2">
                <h3 id="name-p2">🔵 Pemain 2</h3>
                <div class="money">Rp <span id="money-p2">1500</span></div>
                <div class="location">📍 <span id="pos-p2">GO</span></div>
            </div>
        </div>

        <div class="action-area">
            <p id="message-text">Giliran Pemain 1 · lempar dadu!</p>
            <button id="btn-roll" class="btn" onclick="game.rollDice()">🎲 LEMPAR DADU</button>
            <div id="property-actions">
                <button class="btn btn-buy" onclick="game.buyProperty()">💰 BELI</button>
                <button class="btn btn-pass" onclick="game.endTurn()">⏭️ LEWATI</button>
            </div>
            <button class="btn-reset" onclick="location.reload()">🔄 Ganti Mode / Reset Game</button>
        </div>

        <div class="log-box" id="game-log">
            <div class="log-entry">🚀 Selamat datang di Mini Monopoli Modern!</div>
        </div>
    </div>
</div>

<script>
const SPACES_DATA = [
    { id: 0, name: "START / GO", type: "go", price: 0 },
    { id: 1, name: "Jakarta", type: "prop", price: 100, rent: 30, color: "#ef4444" },
    { id: 2, name: "Kesempatan", type: "chance", price: 0 },
    { id: 3, name: "Bandung", type: "prop", price: 120, rent: 35, color: "#ef4444" },
    { id: 4, name: "PENJARA", type: "jail", price: 0 },
    { id: 5, name: "Surabaya", type: "prop", price: 150, rent: 45, color: "#3b82f6" },
    { id: 6, name: "Pajak Listrik", type: "tax", price: 0, tax: 80 },
    { id: 7, name: "Medan", type: "prop", price: 180, rent: 55, color: "#3b82f6" },
    { id: 8, name: "PARKIR BEBAS", type: "parking", price: 0 },
    { id: 9, name: "Bali", type: "prop", price: 220, rent: 70, color: "#eab308" },
    { id: 10, name: "Kesempatan", type: "chance", price: 0 },
    { id: 11, name: "Makassar", type: "prop", price: 250, rent: 85, color: "#eab308" },
    { id: 12, name: "MASUK PENJARA", type: "gotojail", price: 0 },
    { id: 13, name: "Papua", type: "prop", price: 300, rent: 100, color: "#a855f7" },
    { id: 14, name: "Pajak Mewah", type: "tax", price: 0, tax: 150 },
    { id: 15, name: "Kalimantan", type: "prop", price: 350, rent: 120, color: "#a855f7" }
];

const GRID_COORDS = [
    { r:5, c:5 }, { r:5, c:4 }, { r:5, c:3 }, { r:5, c:2 }, { r:5, c:1 },
    { r:4, c:1 }, { r:3, c:1 }, { r:2, c:1 },
    { r:1, c:1 }, { r:1, c:2 }, { r:1, c:3 }, { r:1, c:4 }, { r:1, c:5 },
    { r:2, c:5 }, { r:3, c:5 }, { r:4, c:5 }
];

class MonopolyGame {
    constructor(mode = 'pvp') {
        this.mode = mode; // 'pvp' atau 'ai'
        this.players = [
            { id: 1, name: "Pemain 1", money: 1500, pos: 0, color: "var(--p1-color)", jailed: false, isAI: false },
            { id: 2, name: mode === 'ai' ? "Bot AI 🤖" : "Pemain 2", money: 1500, pos: 0, color: "var(--p2-color)", jailed: false, isAI: mode === 'ai' }
        ];
        this.currentPlayerIdx = 0;
        this.spaces = JSON.parse(JSON.stringify(SPACES_DATA));
        this.spaces.forEach(s => s.owner = null);

        // Web Audio Context untuk Efek Suara Dadu
        this.audioCtx = null;

        this.initBoard();
        this.updateTokens();
        this.updateUI();
    }

    // Fungsi Suara Lempar Dadu (Web Audio API)
    playDiceSound() {
        if (!this.audioCtx) {
            this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        const osc = this.audioCtx.createOscillator();
        const gain = this.audioCtx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150 + Math.random() * 200, this.audioCtx.currentTime);
        
        gain.gain.setValueAtTime(0.1, this.audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + 0.05);

        osc.connect(gain);
        gain.connect(this.audioCtx.destination);

        osc.start();
        osc.stop(this.audioCtx.currentTime + 0.05);
    }

    initBoard() {
        const board = document.getElementById('board');
        this.spaces.forEach((space, idx) => {
            const el = document.createElement('div');
            el.className = `space type-${space.type}`;
            el.id = `space-${idx}`;
            el.style.gridRow = GRID_COORDS[idx].r;
            el.style.gridColumn = GRID_COORDS[idx].c;

            let headerHtml = space.color ? `<div class="space-header" style="background:${space.color}"></div>` : '';

            el.innerHTML = `
                ${headerHtml}
                <div class="space-name">${space.name}</div>
                ${space.price > 0 ? `<div class="space-price">Rp ${space.price}</div>` : ''}
                <div class="tokens-container" id="tokens-${idx}"></div>
                <div class="owner-badge" id="owner-${idx}"></div>
            `;
            board.appendChild(el);
        });
    }

    updateTokens() {
        this.spaces.forEach((_, idx) => {
            const container = document.getElementById(`tokens-${idx}`);
            if (container) container.innerHTML = '';
        });

        this.players.forEach((player, idx) => {
            const container = document.getElementById(`tokens-${player.pos}`);
            if (container) {
                const token = document.createElement('div');
                token.className = `player-token p${idx + 1}-token`;
                container.appendChild(token);
            }
        });
    }

    rollDice() {
        const btn = document.getElementById('btn-roll');
        btn.disabled = true;
        let count = 0;
        const diceDisplay = document.getElementById('dice-display');

        const interval = setInterval(() => {
            const temp = Math.floor(Math.random() * 6) + 1;
            diceDisplay.innerText = ['⚀','⚁','⚂','⚃','⚄','⚅'][temp - 1];
            
            this.playDiceSound();
            
            count++;

            if (count > 10) {
                clearInterval(interval);
                const finalDice = Math.floor(Math.random() * 6) + 1;
                diceDisplay.innerText = ['⚀','⚁','⚂','⚃','⚄','⚅'][finalDice - 1];
                this.finalizeMove(finalDice);
            }
        }, 60);
    }

    finalizeMove(dice) {
        const player = this.players[this.currentPlayerIdx];
        this.log(`${player.name} melempar dadu: **${dice}**`);

        if (player.jailed) {
            if (dice === 6) {
                player.jailed = false;
                this.log(`🎉 Dadu 6! ${player.name} bebas dari penjara.`);
            } else {
                this.log(`⛓️ ${player.name} gagal melempar dadu 6 dan masih di penjara.`);
                this.endTurn();
                return;
            }
        }

        let newPos = (player.pos + dice) % 16;
        if (newPos < player.pos && !player.jailed) {
            player.money += 200;
            this.log(`🏁 ${player.name} melewati GO! +Rp 200`);
        }

        player.pos = newPos;
        this.updateTokens();
        this.handleSpace(player, this.spaces[newPos]);
        this.updateUI();
    }

    handleSpace(player, space) {
        const msg = document.getElementById('message-text');
        const btnRoll = document.getElementById('btn-roll');
        const propActions = document.getElementById('property-actions');

        btnRoll.style.display = 'none';
        propActions.style.display = 'none';

        switch(space.type) {
            case 'prop':
                if (space.owner === null) {
                    if (player.money >= space.price) {
                        msg.innerText = `${space.name} dijual seharga Rp ${space.price}`;
                        if (player.isAI) {
                            // Keputusan Logika AI: Beli jika uang cukup
                            setTimeout(() => {
                                this.buyProperty();
                            }, 1000);
                        } else {
                            propActions.style.display = 'flex';
                        }
                    } else {
                        msg.innerText = `${space.name} terlalu mahal untuk dibeli.`;
                        setTimeout(() => this.endTurn(), 1200);
                    }
                } else if (space.owner !== player.id) {
                    const owner = this.players.find(p => p.id === space.owner);
                    msg.innerText = `Bayar sewa Rp ${space.rent} ke ${owner.name}`;
                    this.transferMoney(player, owner, space.rent);
                    setTimeout(() => this.endTurn(), 1500);
                } else {
                    msg.innerText = `Anda berada di properti sendiri.`;
                    setTimeout(() => this.endTurn(), 1000);
                }
                break;

            case 'chance':
                this.triggerChance(player);
                break;

            case 'tax':
                msg.innerText = `${space.name}! Bayar Rp ${space.tax}`;
                player.money -= space.tax;
                this.checkBankruptcy(player);
                setTimeout(() => this.endTurn(), 1200);
                break;

            case 'gotojail':
                msg.innerText = "🚨 Anda ditangkap dan masuk penjara!";
                player.pos = 4;
                player.jailed = true;
                this.updateTokens();
                setTimeout(() => this.endTurn(), 1500);
                break;

            default:
                msg.innerText = `Singgah di ${space.name}`;
                setTimeout(() => this.endTurn(), 1000);
        }
    }

    buyProperty() {
        const player = this.players[this.currentPlayerIdx];
        const space = this.spaces[player.pos];
        if (player.money >= space.price && space.owner === null) {
            player.money -= space.price;
            space.owner = player.id;
            
            const badge = document.getElementById(`owner-${player.pos}`);
            badge.style.background = player.color;

            this.log(`🏘️ ${player.name} membeli **${space.name}**`);
            this.endTurn();
        }
    }

    triggerChance(player) {
        const cards = [
            { txt: "Dapat bonus investasi! +Rp 150", val: 150 },
            { txt: "Bayar denda parkir! -Rp 100", val: -100 },
            { txt: "Maju 2 langkah", move: 2 },
            { txt: "Mundur 1 langkah", move: -1 }
        ];
        const card = cards[Math.floor(Math.random() * cards.length)];
        this.log(`❓ Kesempatan: ${card.txt}`);

        if (card.val) {
            player.money += card.val;
            this.checkBankruptcy(player);
        }
        if (card.move) {
            player.pos = (player.pos + card.move + 16) % 16;
            this.updateTokens();
        }
        setTimeout(() => this.endTurn(), 1500);
    }

    transferMoney(from, to, amount) {
        from.money -= amount;
        to.money += amount;
        this.log(`💸 ${from.name} membayar Rp ${amount} ke ${to.name}`);
        this.checkBankruptcy(from);
    }

    checkBankruptcy(player) {
        if (player.money < 0) {
            alert(`💥 ${player.name} BANGKRUT! Permainan selesai.`);
            location.reload();
        }
    }

    endTurn() {
        this.currentPlayerIdx = (this.currentPlayerIdx + 1) % 2;
        this.updateUI();
        const nextPlayer = this.players[this.currentPlayerIdx];
        
        document.getElementById('message-text').innerText = `Giliran ${nextPlayer.name} · lempar dadu!`;
        
        if (nextPlayer.isAI) {
            document.getElementById('btn-roll').style.display = 'block';
            document.getElementById('btn-roll').disabled = true;
            document.getElementById('property-actions').style.display = 'none';
            
            // AI Melempar Dadu Secara Otomatis setelah jeda singkat
            setTimeout(() => {
                this.rollDice();
            }, 1000);
        } else {
            document.getElementById('btn-roll').style.display = 'block';
            document.getElementById('btn-roll').disabled = false;
            document.getElementById('property-actions').style.display = 'none';
        }
    }

    updateUI() {
        document.getElementById('name-p1').innerText = `🔴 ${this.players[0].name}`;
        document.getElementById('name-p2').innerText = `🔵 ${this.players[1].name}`;

        document.getElementById('money-p1').innerText = this.players[0].money;
        document.getElementById('pos-p1').innerText = this.spaces[this.players[0].pos].name;
        document.getElementById('money-p2').innerText = this.players[1].money;
        document.getElementById('pos-p2').innerText = this.spaces[this.players[1].pos].name;

        document.getElementById('card-p1').classList.toggle('active', this.currentPlayerIdx === 0);
        document.getElementById('card-p2').classList.toggle('active', this.currentPlayerIdx === 1);
    }

    log(msg) {
        const logBox = document.getElementById('game-log');
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.innerHTML = msg;
        logBox.insertBefore(entry, logBox.firstChild);
    }
}

let game;

function startGame(mode) {
    document.getElementById('mode-overlay').style.display = 'none';
    game = new MonopolyGame(mode);
}
</script>
